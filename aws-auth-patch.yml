apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::869650437559:role/eksctl-simple-jwt-api-nodegroup-ng-NodeInstanceRole-xc5z1TpttecJ
      username: system:node:{{EC2PrivateDNSName}}
      groups:
        - system:bootstrappers
        - system:nodes
    - rolearn: arn:aws:iam::869650437559:role/UdacityFlaskDeployCBKubectlRole
      username: build
      groups:
        - system:masters
